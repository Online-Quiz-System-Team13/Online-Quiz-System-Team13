
name: Quiz System Tests

on:
  push:
    branches:
      - main
      - feature/shwetha-quiz-submission-scoring

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Quiz Tests
        run: node js/quiz.test.js
