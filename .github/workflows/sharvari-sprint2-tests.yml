name: Sprint 2 Admin Tests (Sharvari)

on:
  push:
    branches:
      - main
      - feature/sharvari-sprint-2
  pull_request:
    branches:
      - main

jobs:
  admin-tests:
    name: Admin login, edit, delete and error tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: |
          node --check sprint2/admin-messages.js
          node --check sprint2/FR-09-admin-login.js
          node --check sprint2/FR-10-add-question.js
          node --check sprint2/FR-11-edit-question.js
          node --check sprint2/FR-12-delete-question.js
          node --check sprint2/FR-13-view-questions.js

      - name: Run administrator feature tests
        run: node --test sprint2/FR-13-view-questions.test.js sprint2/TEST-02-admin-login-access.test.js sprint2/TEST-03-question-validation.test.js sprint2/TEST-05-errors-messages.test.js sprint2/TEST-06-usability.test.js
