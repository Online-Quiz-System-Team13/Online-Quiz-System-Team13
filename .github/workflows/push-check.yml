
name: Push Tests

on:
  push:
    branches:
      - feature/sprint-1-srishti

jobs:
  test:
    name: Push Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Sprint 1 tests
        run: node --test sprint1/FR-03-FR-04.test.js
